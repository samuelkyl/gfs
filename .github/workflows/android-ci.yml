name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || 'XnEe5S7f9kMeOEh5iZenrQ==' }}

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Prepare Release Keystore (push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/gfs-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Release APK (push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Package Downloadable APK Artifact (push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package_apk
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_NAME=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK_NAME="gfs-v${VERSION_NAME}-${SHORT_SHA}.apk"
            cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          else
            APK_NAME="gfs-v${VERSION_NAME}-${SHORT_SHA}-unsigned.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/$APK_NAME"
          fi
          (cd dist && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          echo "artifact_name=gfs-v${VERSION_NAME}-${SHORT_SHA}-apk" >> "$GITHUB_OUTPUT"

      - name: Upload Downloadable APK (push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package_apk.outputs.artifact_name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          retention-days: 3
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/gfs-release.jks"
